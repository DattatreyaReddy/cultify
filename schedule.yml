# Booking preferences. Config entries are tried in order for each matching day.
# Omit days to apply an entry every day.
# Times can be "07:00:00", "7:00", or "7AM" — quote them so YAML keeps them as strings.

config:
  - workout: HRX WORKOUT
    slots: ["07:00:00", "08:00:00"]
    days: [monday]
  - workout: ADIDAS STRENGTH+
    slots: ["07:30:00", "08:30:00"]
    days: [tuesday]

# Example entry with no days applies every day:
#  - workout: BURN
#    slots: ["09:00:00"]
